<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITRO | Official</title>
    <style>
        /* Modern Minimalist Style */
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #001f3f; /* Deep Navy Blue */
            margin-bottom: 10px;
            font-weight: 900;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .btn {
            text-decoration: none;
            color: #ffffff;
            background-color: #001f3f;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #003366;
            letter-spacing: 4px;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RITRO</h1>
        <p>QUALITY APPAREL & BRAND IDENTITY</p>
        <a href="#" class="btn">Coming Soon</a>
    </div>

    <footer>
        &copy; 2026 RITRO Studio. All Rights Reserved.
    </footer>

</body>
</html>
